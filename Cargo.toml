[package]
name = "glowing-spork"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
dotenvy = "0.15.7"
json5 = "1.3.3"
log = "0.4.34"
notify = "8.2.0"
poise = "0.6.2"
quick-xml = { version = "0.42.0", features = ["async-tokio"] }
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "debug-print",
    "macros",
    "sqlx-sqlite",
] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["parking_lot"] }
